<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Vindarr Market</title>

<link
rel="icon"
href="interfacelog.png">

<link
rel="stylesheet"
href="css/global.css">

<link
rel="stylesheet"
href="css/market.css">

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<!-- ===========================
MARKET FEED
=========================== -->

<div id="marketFeed">

    <div id="marketFeedList">

        <!-- market.js renders every fullscreen item here -->

    </div>

</div>

<!-- ===========================
TOP CATEGORY BAR
=========================== -->

<div class="market-top-overlay">

    <div class="market-categories">

        <button
        class="market-tab active-category"
        data-type="all">

            All

        </button>

        <button
        class="market-tab"
        data-type="ebook">

            Ebooks

        </button>

        <button
        class="market-tab"
        data-type="fashion">

            Fashion

        </button>

        <button
        class="market-tab"
        data-type="essential">

            Essentials

        </button>

    </div>

    <div class="market-top-icons">

        <button
        onclick="window.location.href='search.html'">

            <i class="bi bi-search"></i>

        </button>

        <button
        onclick="window.location.href='notifications.html'">

            <i class="bi bi-bell"></i>

        </button>

        <button
        onclick="window.location.href='menu.html'">

            <i class="bi bi-list"></i>

        </button>

    </div>

</div>

<!-- ===========================
LOADING SCREEN
=========================== -->

<div
id="marketLoading"
class="market-loading">

    <div class="spinner-border text-light">

    </div>

</div>

<!-- ===========================
SCRIPTS
=========================== -->

<script src="js/config.js"></script>

<script src="js/utils.js"></script>

<script src="js/nav.js"></script>

<script src="js/auth.js"></script>

<script src="js/market.js"></script>

<script>

checkAuth();

</script>

</body>

</html>
