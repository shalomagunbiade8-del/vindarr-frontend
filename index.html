<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    rel="icon"
    href="./interfacelog.png"
    type="image/png"
  >

  <title>Vindarr</title>

  <!-- GLOBAL CSS -->
  <!-- <link
    rel="stylesheet"
    href="css/global.css"
  > -->

  <!-- GLOBAL CSS -->
  <link
    rel="stylesheet"
    href="css/feed.css"
  >

  <!-- BOOTSTRAP ICONS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

</head>


<body>


<!-- =====================================
     VINDARR VIDEO FEED
===================================== -->

<main id="feed"></main>


<!-- =====================================
     TOP CONTROLS
===================================== -->

<div class="feed-top-bar">


  <!-- NOTIFICATIONS -->

  <button
    class="feed-top-button"
    type="button"
    onclick="openNotifications()"
    aria-label="Notifications"
  >

    <i class="bi bi-bell"></i>

    <span
      id="notifBadge"
      class="notification-badge"
    ></span>

  </button>

   <!-- SEARCH -->
  <div
    class="feed-top-btn"
    onclick="window.location.href='search.html'"
  >
    <i class="bi bi-search"></i>
  </div>


  <!-- MENU -->

  <button
    class="feed-top-button"
    type="button"
    onclick="openFeedMenu()"
    aria-label="Menu"
  >

    <i class="bi bi-three-dots"></i>

  </button>


</div>



<!-- =====================================
     NOTIFICATIONS
===================================== -->

<div
  id="notifDropdown"
  class="notif-dropdown"
>

  <div class="notification-header">

    <h3>
      Notifications
    </h3>

    <button
      type="button"
      onclick="closeNotifications()"
    >
      <i class="bi bi-x-lg"></i>
    </button>

  </div>


  <div id="notifList">

    <p>
      No notifications yet
    </p>

  </div>

</div>



<!-- =====================================
     JAVASCRIPT
===================================== -->

<script src="js/config.js"></script>

<script src="js/utils.js"></script>

<script src="js/nav.js"></script>

<script src="js/auth.js"></script>

<script src="js/feed.js"></script>


<script>

  if (typeof checkAuth === "function") {
    checkAuth();
  }

</script>


</body>

</html>
