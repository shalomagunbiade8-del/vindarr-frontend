<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Record Find • Vindarr</title>

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="css/record-search.css">

</head>

<body class="record-search-body">

<div class="record-shell">

    <!-- ===================================== -->
    <!-- HEADER -->
    <!-- ===================================== -->

    <header class="record-header">

        <button
            class="back-btn"
            onclick="history.back()">

            <i class="bi bi-arrow-left"></i>

        </button>

        <div class="record-title">

            <h2>Find Something</h2>

            <p>
                Record what you're looking for
            </p>

        </div>

    </header>

    <!-- ===================================== -->
    <!-- CAMERA -->
    <!-- ===================================== -->

    <section class="camera-section">

        <video

            id="camera"

            class="camera-preview"

            autoplay

            playsinline

            muted>

        </video>

        <video

            id="playback"

            class="camera-preview"

            controls

            style="display:none;">

        </video>

        <!-- overlay -->

        <div class="camera-overlay">

            <div class="record-status">

                <span class="live-dot"></span>

                <span>LIVE</span>

            </div>

            <div
                id="recordTimer"
                class="record-timer">

                00:00

            </div>

        </div>

    </section>

    <!-- ===================================== -->
    <!-- FORM -->
    <!-- ===================================== -->

    <section class="find-form">

        <div class="form-group">

            <label>

                What are you looking for?

            </label>

            <textarea

                id="caption"

                maxlength="300"

                placeholder="Describe what you need so the community can help...">

            </textarea>

            <div
                id="captionCount"
                class="caption-counter">

                0 / 300

            </div>

        </div>

        <div class="row g-3">

            <div class="col-md-6">

                <label>

                    Category

                </label>

                <select
                    id="findCategory"
                    class="form-select">

                    <option value="BOOK">
                        Book
                    </option>

                    <option value="PRODUCT">
                        Product
                    </option>

                    <option value="PERSON">
                        Person
                    </option>

                    <option value="BUSINESS">
                        Business
                    </option>

                    <option value="SERVICE">
                        Service
                    </option>

                    <option value="JOB">
                        Job
                    </option>

                    <option value="OTHER">
                        Other
                    </option>

                </select>

            </div>

            <div class="col-md-6">

                <label>

                    Location

                </label>

                <input

                    id="findLocation"

                    class="form-control"

                    type="text"

                    placeholder="Optional">

            </div>

        </div>

                <!-- ===================================== -->
        <!-- VIDEO INFO -->
        <!-- ===================================== -->

        <div
            id="videoInfo"
            class="video-info"
            style="display:none;">

            <div class="info-item">

                <i class="bi bi-camera-reels-fill"></i>

                <div>

                    <small>Recorded Video</small>

                    <strong id="videoSize">
                        0 MB
                    </strong>

                </div>

            </div>

        </div>

        <!-- ===================================== -->
        <!-- UPLOAD STATUS -->
        <!-- ===================================== -->

        <div
            id="uploadCard"
            class="upload-card"
            style="display:none;">

            <div class="upload-spinner"></div>

            <h4 id="uploadTitle">
                Uploading...
            </h4>

            <p id="uploadText">
                Preparing your Find request...
            </p>

            <div class="progress">

                <div

                    id="uploadProgress"

                    class="progress-bar progress-bar-striped progress-bar-animated"

                    style="width:0%;">

                    0%

                </div>

            </div>

        </div>

    </section>

    <!-- ===================================== -->
    <!-- FLOATING CONTROLS -->
    <!-- ===================================== -->

    <footer class="record-controls">

        <button

            id="switchCameraBtn"

            class="icon-btn">

            <i class="bi bi-arrow-repeat"></i>

        </button>

        <button

            id="recordBtn"

            class="record-button">

            <span></span>

        </button>

        <button

            id="retakeBtn"

            class="icon-btn"

            style="display:none;">

            <i class="bi bi-arrow-counterclockwise"></i>

        </button>

        <button

            id="uploadBtn"

            class="publish-btn"

            style="display:none;">

            <i class="bi bi-send-fill"></i>

            <span>

                Publish Request

            </span>

        </button>

    </footer>

    </div>

<!-- ===================================== -->
<!-- SCRIPTS -->
<!-- ===================================== -->

<script src="js/config.js"></script>

<script src="js/auth.js"></script>

<script>

checkAuth();

</script>

<script src="js/record-search.js"></script>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
