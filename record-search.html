<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Record a Find — Vindarr</title>

    <link
        rel="stylesheet"
        href="css/record-search.css"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body>

<header class="record-header">

    <button
        id="backBtn"
        class="icon-btn"
        type="button"
        aria-label="Go back"
    >
        <i class="bi bi-x-lg"></i>
    </button>

    <h1>NEW FIND</h1>

  
        
    <button
        id="nextBtn"
        class="next-btn"
        type="button"    
    >
        
        FINDS
    </button>
  

</header>


<main class="record-page">

    <section class="camera-card">

        <div class="camera-stage">

            <video
                id="camera"
                autoplay
                playsinline
            ></video>

            <video
                id="playback"
                controls
                playsinline
            ></video>

            <div
                id="cameraMessage"
                class="camera-message"
            >
                <i class="bi bi-camera-video"></i>
                <p>Preparing camera...</p>
            </div>

            <div
                id="recordTimer"
                class="record-timer"
            >
                00:00
            </div>

        </div>


        <div class="camera-controls">

            <button
                id="switchCameraBtn"
                class="camera-control"
                type="button"
                aria-label="Switch camera"
            >
                <i class="bi bi-arrow-repeat"></i>
            </button>

            <button
                id="recordBtn"
                class="record-btn"
                type="button"
                aria-label="Start recording"
            >
                <span></span>
            </button>

            <button
                id="retakeBtn"
                class="camera-control"
                type="button"
                aria-label="Retake"
            >
                <i class="bi bi-arrow-counterclockwise"></i>
            </button>

        </div>

    </section>


    <section
        id="videoInfo"
        class="video-info"
    >

        <div>
            <strong id="videoSize">
                0 MB
            </strong>

            <span>
                Recorded video
            </span>
        </div>

    </section>


    <section class="find-form">

        <div class="form-group">

            <label for="caption">
                What are you trying to find?
            </label>

            <textarea
                id="caption"
                maxlength="300"
                placeholder="Record your question, product, book, place, object or anything you need help discovering..."
            ></textarea>

            <div
                id="captionCount"
                class="caption-count"
            >
                0 / 300
            </div>

        </div>


        <div class="form-group">

            <label for="findCategory">
                Category
            </label>

            <select id="findCategory">

                <option value="">
                    Select category
                </option>

                <option value="Products">
                    Products
                </option>

                <option value="Books">
                    Books
                </option>

                <option value="Fashion">
                    Fashion
                </option>

                <option value="Food">
                    Food
                </option>

                <option value="Technology">
                    Technology
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="Travel">
                    Travel
                </option>

                <option value="Business">
                    Business
                </option>

                <option value="People">
                    People
                </option>

                <option value="Places">
                    Places
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="findLocation">
                Location
            </label>

            <input
                id="findLocation"
                type="text"
                placeholder="Optional location"
            >

        </div>

    </section>


    <button
        id="sendFindBtn"
        class="send-find-btn"
        type="button"
    >
        <i class="bi bi-search"></i>
        Send Find
    </button>


    <div
        id="uploadCard"
        class="upload-card"
    >

        <div class="upload-icon">
            <i class="bi bi-cloud-arrow-up"></i>
        </div>

        <strong id="uploadTitle">
            Publishing...
        </strong>

        <p id="uploadText">
            Uploading your Find request.
        </p>

        <div class="progress-track">

            <div
                id="uploadProgress"
                class="progress-bar"
            ></div>

        </div>

    </div>

</main>


<script src="js/config.js"></script>
<script src="js/record-search.js"></script>

</body>
</html>
