<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Earnings</title>

<link rel="stylesheet" href="css/global.css">

</head>
<body>

<nav class="top-navbar">

<div class="top-left">

<img src="interfacelog.png" width="30">

<span>Earnings</span>

</div>

</nav>

<div class="earnings-page">

    <div class="earnings-card">

  <h1 id="walletBalance">
    ₦0
  </h1>

  <p>Wallet Balance</p>

</div>

<div class="earnings-card">

  <h3>Bank Details</h3>

  <input
    id="bankName"
    placeholder="Bank Name"
  >

  <input
    id="accountNumber"
    placeholder="Account Number"
  >

  <input
    id="accountName"
    placeholder="Account Name"
  >

  <button
  type="button"
  id="saveBankBtn"
  class="earn-btn"
>
    Save Bank Details
  </button>

</div>

<div class="earnings-card">

<h1 id="earningsAmount">
₦0
</h1>

<p>Total Earnings</p>

<button
  id="withdrawBtn"
  class="earn-btn"
>
  Withdraw Earnings
</button>

</div>

<div id="transactions"></div>

<h2>
  Withdrawal History
</h2>

<div
  id="withdrawalHistory"
></div>

</div>

<script src="js/config.js"></script>
<script src="js/earnings.js"></script>
<script src="js/auth.js"></script>
<script>
checkAuth();
</script>

</body>
</html>
