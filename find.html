<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Find — Vindarr</title>

    <link
        rel="stylesheet"
        href="css/find.css"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

</head>

<body>

<header class="find-header">

    <button
        id="backBtn"
        class="header-btn"
        type="button"
    >
        <i class="bi bi-arrow-left"></i>
    </button>

    <h1>
        FIND
    </h1>

    <button
        id="recordFindBtn"
        class="header-btn find-camera"
        type="button"
        aria-label="Record a Find"
    >
        <i class="bi bi-camera-video"></i>
    </button>

</header>


<main class="find-page">

    <div
        id="loading"
        class="loading"
    >
        Loading Finds...
    </div>

    <section
        id="findFeed"
        class="find-feed"
    ></section>

    <div
        id="emptyState"
        class="empty-state"
    >

        <i class="bi bi-search"></i>

        <h2>
            Nothing here yet
        </h2>

        <p>
            Be the first person to record something you want the Vindarr community to help find.
        </p>

        <button
            id="emptyRecordBtn"
            type="button"
        >
            Record a Find
        </button>

    </div>

</main>


<script src="js/config.js"></script>
<script src="js/find.js"></script>

</body>
</html>
