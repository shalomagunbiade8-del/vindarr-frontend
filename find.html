<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Find • Vindarr</title>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
>

<link
    rel="stylesheet"
    href="css/config.css"
>

<link rel="stylesheet" href="css/find.css">

</head>

<body class="find-search-body">

<div class="find-app">

<!-- ==========================================
     HEADER
========================================== -->

<header class="find-header">

    <div class="find-header-left">

        <button
            class="header-icon"
            id="backBtn"
            aria-label="Go back"
        >
            <i class="bi bi-arrow-left"></i>
        </button>

        <div>

            <h1>Find</h1>

            <p>
                Help someone find what they need.
            </p>

        </div>

    </div>

    <button
        class="create-find-btn"
        id="createFindBtn"
    >
        <i class="bi bi-camera-video-fill"></i>
        <span>Record</span>
    </button>

</header>


<!-- ==========================================
     SEARCH
========================================== -->

<section class="find-search-area">

    <div class="find-search-box">

        <i class="bi bi-search"></i>

        <input
            type="search"
            id="searchInput"
            placeholder="Search what people are looking for..."
            autocomplete="off"
        >

        <button
            id="clearSearchBtn"
            class="clear-search-btn"
            type="button"
            aria-label="Clear search"
        >
            <i class="bi bi-x"></i>
        </button>

    </div>

</section>


<!-- ==========================================
     FILTERS
========================================== -->

<section class="find-filters">

    <button
        class="filter-chip active"
        data-filter="recent"
    >
        Recent
    </button>

    <button
        class="filter-chip"
        data-filter="trending"
    >
        Trending
    </button>

    <button
        class="filter-chip"
        data-filter="open"
    >
        Open
    </button>

    <button
        class="filter-chip"
        data-filter="solved"
    >
        Solved
    </button>

    <button
        class="filter-chip"
        data-filter="BOOK"
    >
        Books
    </button>

    <button
        class="filter-chip"
        data-filter="PRODUCT"
    >
        Products
    </button>

    <button
        class="filter-chip"
        data-filter="PERSON"
    >
        People
    </button>

    <button
        class="filter-chip"
        data-filter="BUSINESS"
    >
        Business
    </button>

    <button
        class="filter-chip"
        data-filter="SERVICE"
    >
        Services
    </button>

    <button
        class="filter-chip"
        data-filter="JOB"
    >
        Jobs
    </button>

</section>


<!-- ==========================================
     MAIN
========================================== -->

<main class="find-main">

    <div
        id="loadingState"
        class="find-loading"
    >

        <div class="loading-spinner"></div>

        <p>
            Loading Find requests...
        </p>

    </div>


    <div
        id="emptyState"
        class="find-empty"
        style="display:none;"
    >

        <div class="empty-icon">

            <i class="bi bi-search"></i>

        </div>

        <h2>
            Nothing found yet
        </h2>

        <p>
            Be the first person to record a Find request.
        </p>

        <button
            id="emptyCreateBtn"
            class="empty-create-btn"
        >
            <i class="bi bi-camera-video-fill"></i>
            Record a Find
        </button>

    </div>


    <div
        id="findGrid"
        class="find-grid"
    ></div>


    <div
        id="loadMoreWrap"
        class="load-more-wrap"
        style="display:none;"
    >

        <button
            id="loadMoreBtn"
            class="load-more-btn"
        >
            Load more
        </button>

    </div>

</main>



</div>

<script src="js/config.js"></script>

<script src="js/auth.js"></script>

<script src="find.js"></script>

<script>
    document.addEventListener(
        "DOMContentLoaded",
        () => {

            if (
                typeof checkAuth === "function"
            ) {
                checkAuth();
            }

        }
    );
</script>

</body>
</html>
