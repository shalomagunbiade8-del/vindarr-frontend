<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Vindarr Stories</title>

<link rel="stylesheet"
href="css/global.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>
<body>

<!-- TOP NAV -->
<nav class="top-navbar">

  <div class="top-left">

    <img src="interfacelog.png"
    width="30">

    <span>Stories</span>

  </div>

  <div class="top-right">

    <button
      class="story-create-btn"
      onclick="openStoryModal()"
    >

      <i class="bi bi-plus-lg"></i>

      Write

    </button>

  </div>

</nav>

<!-- STORIES -->
<div class="stories-page">

  <!-- FEATURED -->
  <div class="featured-story">

    <div class="featured-overlay"></div>

    <img
      src="https://images.unsplash.com/photo-1499750310107-5fef28a66643?q=80&w=1200&auto=format&fit=crop"
    >

    <div class="featured-content">

      <span class="story-badge">
        Vindarr Stories
      </span>

      <h1>
        Discover stories,
        creator insights,
        ebooks and culture
      </h1>

    </div>

  </div>

  <!-- FEED -->
  <div id="storiesFeed"
    class="stories-feed">

  </div>

</div>

<!-- STORY MODAL -->
<div id="storyModal"
class="story-modal">

  <div class="story-modal-content">

    <div class="story-modal-top">

      <h2>
        Create Story
      </h2>

      <i class="bi bi-x-lg"
      onclick="closeStoryModal()"></i>

    </div>

    <input
      id="storyTitle"
      class="story-input"
      placeholder="Story title"
    >

    <textarea
      id="storyContent"
      class="story-textarea"
      placeholder="Write your story..."
    ></textarea>

    <input
      type="file"
      id="storyImage"
      class="story-input"
      accept="image/*"
    >

    <button
      class="publish-story-btn"
      onclick="publishStory()"
    >

      Publish Story

    </button>

  </div>

</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/stories.js"></script>

<script>
checkAuth();
</script>

</body>
</html>
