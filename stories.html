<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Vindarr Stories</title>

<link rel="stylesheet"
href="css/global.css">

<link rel="stylesheet"
href="css/stories.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body class="stories-page">

<!-- ==========================================
LOADING
=========================================== -->

<div id="storyLoading"
class="market-loading">

    <div class="loader"></div>

</div>

<!-- ==========================================
FULLSCREEN STORY FEED
=========================================== -->

<div
id="storiesFeed"
class="video-feed">

</div>

<!-- ==========================================
CREATE STORY MODAL
=========================================== -->

<div
id="storyModal"
class="story-modal">

    <div
    class="story-modal-content">

        <!-- Header -->

        <div
        class="story-modal-top">

            <h2>Create Story</h2>

            <button
            type="button"
            class="close-modal-btn"
            onclick="closeStoryModal()">

                <i class="bi bi-x-lg"></i>

            </button>

        </div>

        <!-- Title -->

        <input
        id="storyTitle"
        class="story-input"
        type="text"
        maxlength="150"
        placeholder="Story title">

        <!-- Story -->

        <textarea
        id="storyContent"
        class="story-textarea"
        placeholder="Write your story..."></textarea>

        <!-- Cover Image -->

        <label
        class="story-upload">

            <i class="bi bi-image"></i>

            <span>
                Choose Cover Image
            </span>

            <input
            type="file"
            id="storyImage"
            accept="image/*"
            hidden>

        </label>

        <!-- Preview -->

        <img
        id="storyPreview"
        class="story-preview-image"
        style="display:none;">

        <!-- Publish -->

        <button
        class="publish-story-btn"
        onclick="publishStory()">

            Publish Story

        </button>

    </div>

</div>

<!-- ==========================================
OPTIONS MENU
=========================================== -->

<div
id="storyMenu"
class="story-options-menu">

    <button onclick="refreshStories()">

        <i class="bi bi-arrow-clockwise"></i>

        Refresh

    </button>

    <button onclick="window.location='saved.html'">

        <i class="bi bi-bookmark"></i>

        Saved Stories

    </button>

    <button onclick="window.location='profile.html'">

        <i class="bi bi-person"></i>

        My Profile

    </button>

</div>

<!-- ==========================================
SCRIPTS
=========================================== -->

<script src="js/config.js"></script>

<script src="js/utils.js"></script>

<script src="js/auth.js"></script>

<script src="js/stories.js"></script>

<!-- ==========================================
INITIALIZE
=========================================== -->

<script>

document.addEventListener(

    "DOMContentLoaded",

    async ()=>{

        // Authentication

        if(typeof checkAuth === "function"){

            checkAuth();

        }

        // Load feed

        if(typeof loadStories === "function"){

            await loadStories();

        }

        // Preview selected cover image

        const imageInput =
        document.getElementById("storyImage");

        const preview =
        document.getElementById("storyPreview");

        if(imageInput){

            imageInput.addEventListener(

                "change",

                e=>{

                    const file =
                    e.target.files[0];

                    if(!file){

                        preview.style.display =
                        "none";

                        return;

                    }

                    preview.src =
                    URL.createObjectURL(file);

                    preview.style.display =
                    "block";

                }

            );

        }

        // Close menu when clicking outside

        document.addEventListener(

            "click",

            e=>{

                const menu =
                document.getElementById(
                    "storyMenu"
                );

                if(

                    !menu ||

                    menu.contains(e.target) ||

                    e.target.closest(".story-menu-btn")

                ){

                    return;

                }

                menu.classList.remove("show");

            }

        );

    }

);

</script>

</body>
</html>
