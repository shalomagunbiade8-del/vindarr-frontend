<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Publish • Vindarr</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<!-- TOP NAV -->
<nav class="top-navbar">

  <div class="top-left">
    <img src="interfacelog.png" width="32">
    <span>Vindarr Studio</span>
  </div>

</nav>

<!-- PAGE -->
<div class="publish-page">

  <h2>Create Content</h2>

  <!-- TYPE SELECT -->
  <div class="publish-types">

    <button id="videoBtn"
    onclick="setType('video')">
      🎥 Video
    </button>

    <button id="ebookBtn"
    onclick="setType('ebook')">
      📚 Ebook
    </button>

    <button id="fashionBtn"
    onclick="setType('fashion')">
      👕 Product
    </button>

    <button id="essentialBtn"
onclick="setType('essential')">
  🛒 Vindarr Essential
</button>

  </div>

  <!-- TITLE -->
  <input
  id="uTitle"
  class="publish-input"
  placeholder="Title">

  <!-- DESCRIPTION -->
  <textarea
  id="uContext"
  class="publish-textarea"
  placeholder="Write description..."></textarea>

  <!-- CATEGORY -->
  <select
  id="uCategory"
  class="publish-input">

    <option value="">Select category</option>

    <option value="Books">Books</option>
<option value="Fashion">Fashion</option>

<option value="Food">Food</option>
<option value="Snacks">Snacks</option>
<option value="Fruits">Fruits</option>
<option value="Beverages">Beverages</option>
<option value="Stationery">Stationery</option>

<option value="Home">Home</option>
<option value="Beauty">Beauty</option>
<option value="Electronics">Electronics</option>
<option value="Accessories">Accessories</option>

  </select>

  <!-- MAIN FILE -->
  <input
  type="file"
  id="uFile"
  class="publish-input">

  <!-- EBOOK COVER -->
  <input
  type="file"
  id="uCoverImage"
  class="publish-input"
  accept="image/*"
  style="display:none;">

  <!-- PRICE -->
  <input
  id="uPrice"
  class="publish-input"
  placeholder="Price (₦)"
  style="display:none;">

  <!-- STATUS -->
  <div id="uploadStatus"></div>

  <!-- BUTTON -->
  <button
  class="publish-btn"
  onclick="publish()">

    Publish

  </button>

</div>

<script src="js/config.js"></script>
<script src="js/publish.js"></script>
<script src="js/auth.js"></script>
<script>
checkAuth();
</script>

</body>
</html>
