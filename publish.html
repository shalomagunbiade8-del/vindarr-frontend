<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Publish • Vindarr</title>

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<link
rel="stylesheet"
href="css/global.css">

<link
rel="stylesheet"
href="css/publish.css">

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="publish-body">

<div class="publish-shell">

<!-- =====================================
HEADER
===================================== -->

<div class="publish-header">

<div class="publish-header-icon">

<i class="bi bi-cloud-arrow-up-fill"></i>

</div>

<h1>Create Content</h1>

<p>

Upload videos, ebooks and products for your audience.

</p>

</div>

<!-- =====================================
CONTENT TYPE
===================================== -->

<div class="publish-types">

<button
id="videoBtn"
class="active"
onclick="setType('video')">

<i class="bi bi-camera-reels-fill"></i>

<span>Video</span>

</button>

<button
id="ebookBtn"
onclick="setType('ebook')">

<i class="bi bi-book-fill"></i>

<span>Ebook</span>

</button>

<button
id="fashionBtn"
onclick="setType('fashion')">

<i class="bi bi-bag-fill"></i>

<span>Product</span>

</button>

<button
id="essentialBtn"
onclick="setType('essential')">

<i class="bi bi-cart-fill"></i>

<span>Essential</span>

</button>

</div>

<!-- =====================================
TITLE
===================================== -->

<div class="publish-group">

<label>

Title

</label>

<input
id="uTitle"
class="publish-input"
maxlength="120"
placeholder="Give your content a title">

</div>

<!-- =====================================
DESCRIPTION
===================================== -->

<div class="publish-group">

<label>

Description

</label>

<textarea
id="uContext"
class="publish-textarea"
placeholder="Tell people about your content..."></textarea>

</div>

<!-- =====================================
CATEGORY
===================================== -->

<div class="publish-group">

<label>

Category

</label>

<select
id="uCategory"
class="publish-input">

<option value="">
Select category
</option>

<option value="Books">
Books
</option>

<option value="Fashion">
Fashion
</option>

<option value="Food">
Food
</option>

<option value="Snacks">
Snacks
</option>

<option value="Fruits">
Fruits
</option>

<option value="Beverages">
Beverages
</option>

<option value="Stationery">
Stationery
</option>

<option value="Home">
Home
</option>

<option value="Beauty">
Beauty
</option>

<option value="Electronics">
Electronics
</option>

<option value="Accessories">
Accessories
</option>

</select>

</div>

<!-- =====================================
PRICE
===================================== -->

<div
class="publish-group"
id="priceWrapper"
style="display:none;">

<label>

Price

</label>

<div class="price-box">

<span>₦</span>

<input
id="uPrice"
type="number"
placeholder="0">

</div>

</div>

<!-- =====================================
MAIN FILE
===================================== -->

<div class="publish-group">

<label>

Content File

</label>

<label
class="upload-card"
for="uFile">

<div class="upload-card-inner">

<i class="bi bi-cloud-upload-fill"></i>

<h4>

Choose File

</h4>

<p id="fileLabel">

Video, PDF, Image...

</p>

</div>

<input
type="file"
id="uFile"
hidden>

</label>

</div>

<!-- =====================================
MAIN PREVIEW
===================================== -->

<div
id="previewWrapper"
class="preview-wrapper"
style="display:none;">

<img
id="imagePreview"
class="preview-image"
style="display:none;">

<video
id="videoPreview"
class="preview-video"
controls
style="display:none;"></video>

<div
id="pdfPreview"
class="preview-pdf"
style="display:none;">

<i class="bi bi-file-earmark-pdf-fill"></i>

<div>

<strong>

Selected PDF

</strong>

<p id="pdfName"></p>

</div>

</div>

</div>

<!-- =====================================
EBOOK COVER
===================================== -->

<div
class="publish-group"
id="coverWrapper"
style="display:none;">

<label>

Cover Image

</label>

<label
class="upload-card"
for="uCoverImage">

<div class="upload-card-inner">

<i class="bi bi-image-fill"></i>

<h4>

Choose Cover

</h4>

<p>

PNG, JPG or WEBP

</p>

</div>

<input
type="file"
id="uCoverImage"
accept="image/*"
hidden>

</label>

<div
id="coverPreviewWrapper"
class="preview-wrapper"
style="display:none;">

<img
id="coverPreview"
class="preview-image">

</div>

</div>

<!-- =====================================
UPLOAD STATUS
===================================== -->

<div class="publish-group">

<div
id="uploadStatusCard"
class="upload-status-card"
style="display:none;">

<div class="upload-status-top">

<div
id="uploadSpinner"
class="upload-spinner"></div>

<div>

<div
id="uploadStatusTitle"
class="upload-status-title">

Ready

</div>

<div
id="uploadStatusText"
class="upload-status-text">

Waiting...

</div>

</div>

</div>

<div class="progress">

<div
id="uploadProgressBar"
class="progress-bar progress-bar-striped progress-bar-animated"
style="width:0%;">

0%

</div>

</div>

</div>

</div>

<!-- =====================================
PUBLISH BUTTON
===================================== -->

<div class="publish-actions">

<button
id="publishBtn"
class="publish-btn"
onclick="publish()">

<i class="bi bi-send-fill"></i>

<span>

Publish

</span>

</button>

</div>

</div>

<!-- =====================================
SCRIPTS
===================================== -->

<script src="js/config.js"></script>

<script src="js/auth.js"></script>

<script src="js/publish.js"></script>

<script>

checkAuth();

/* =====================================
MAIN FILE PREVIEW
===================================== */

const fileInput =
document.getElementById("uFile");

const imagePreview =
document.getElementById("imagePreview");

const videoPreview =
document.getElementById("videoPreview");

const pdfPreview =
document.getElementById("pdfPreview");

const pdfName =
document.getElementById("pdfName");

const previewWrapper =
document.getElementById("previewWrapper");

fileInput.addEventListener(
"change",
e=>{

const file =
e.target.files[0];

if(!file){

previewWrapper.style.display="none";

imagePreview.style.display="none";

videoPreview.style.display="none";

pdfPreview.style.display="none";

return;

}

previewWrapper.style.display="block";

imagePreview.style.display="none";

videoPreview.style.display="none";

pdfPreview.style.display="none";

const url =
URL.createObjectURL(file);

if(file.type.startsWith("image/")){

imagePreview.src=url;

imagePreview.style.display="block";

}

else if(file.type.startsWith("video/")){

videoPreview.src=url;

videoPreview.style.display="block";

}

else{

pdfName.textContent=file.name;

pdfPreview.style.display="flex";

}

}
);

/* =====================================
COVER PREVIEW
===================================== */

const coverInput =
document.getElementById("uCoverImage");

const coverPreview =
document.getElementById("coverPreview");

const coverWrapper =
document.getElementById("coverPreviewWrapper");

coverInput.addEventListener(
"change",
e=>{

const file =
e.target.files[0];

if(!file){

coverWrapper.style.display="none";

return;

}

coverPreview.src =
URL.createObjectURL(file);

coverWrapper.style.display="block";

}
);

</script>

</body>

</html>
