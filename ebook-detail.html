<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Vindarr • Ebook</title>

  <link
    rel="stylesheet"
    href="css/ebook-detail.css"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

</head>

<body>

  <main class="ebook-reader-page">

    <!-- ================================
         TOP BAR
    ================================= -->

    <header class="ebook-topbar">

      <button
        class="reader-back-btn"
        type="button"
        onclick="goBack()"
        aria-label="Go back"
      >

        <i class="bi bi-arrow-left"></i>

        <span>Back</span>

      </button>


      <div class="reader-brand">

        <div class="reader-brand-logo">

          <img
            src="interfacelog.png"
            alt="Vindarr"
          >

        </div>

        <span>Vindarr</span>

      </div>


      <div class="reader-title-wrap">

        <span class="reader-eyebrow">
          YOUR LIBRARY
        </span>

        <h1
          id="ebookTitle"
          title="Loading..."
        >
          Loading...
        </h1>

      </div>


      <div class="reader-actions">

        <button
          id="fullscreenBtn"
          class="reader-icon-btn"
          type="button"
          onclick="toggleFullscreen()"
          aria-label="Fullscreen"
          title="Fullscreen"
        >

          <i class="bi bi-fullscreen"></i>

        </button>

      </div>

    </header>


    <!-- ================================
         READER
    ================================= -->

    <section
      id="viewerContainer"
      class="ebook-viewer-container"
    >

      <!-- Loading state -->

      <div
        id="ebookLoading"
        class="ebook-loading"
      >

        <div class="loading-logo">

          <img
            src="interfacelog.png"
            alt="Vindarr"
          >

        </div>


        <div class="loading-spinner"></div>


        <h2>
          Opening your book
        </h2>


        <p>
          Preparing your Vindarr reading experience...
        </p>

      </div>


      <!-- Error state -->

      <div
        id="ebookError"
        class="ebook-error"
        hidden
      >

        <div class="error-icon">

          <i class="bi bi-book"></i>

        </div>


        <h2>
          Ebook unavailable
        </h2>


        <p id="ebookErrorMessage">
          We couldn't open this ebook.
        </p>


        <button
          type="button"
          class="retry-btn"
          onclick="loadBook()"
        >

          <i class="bi bi-arrow-clockwise"></i>

          Try Again

        </button>

      </div>


      <!-- PDF viewer -->

      <iframe
        id="ebookFrame"
        class="ebook-frame"
        title="Vindarr ebook reader"
        allowfullscreen
      ></iframe>

    </section>


    <!-- ================================
         FOOTER
    ================================= -->

    <footer class="ebook-reader-footer">

      <div class="reader-footer-left">

        <i class="bi bi-book"></i>

        <span>
          Reading on Vindarr
        </span>

      </div>


      <div class="reader-footer-center">

        <span>
          Your purchased ebook
        </span>

      </div>


      <div class="reader-footer-right">

        <span>

          <i class="bi bi-shield-check"></i>

          Private library

        </span>

      </div>

    </footer>

  </main>


  <script src="js/config.js"></script>

  <script src="js/ebook-detail.js"></script>

</body>

</html>
