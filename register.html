<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Account</title>

<link rel="stylesheet"
href="css/global.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>
<body>

<div class="auth-page">

<img
src="interfacelog.png"
width="70"
style="margin-bottom:20px;"
>

<h1>Create Account</h1>

<input
id="registerUsername"
placeholder="Username"
class="auth-input"
>

<input
id="registerEmail"
placeholder="Email"
class="auth-input"
>

<div class="password-wrapper">

<input
id="registerPassword"
type="password"
placeholder="Password"
class="auth-input"
>

<i
class="bi bi-eye-slash"
id="registerTogglePassword"
onclick="togglePassword('registerPassword','registerTogglePassword')"
></i>

</div>

<button
class="auth-btn"
onclick="register()"
>

Create Account

</button>

<p>

Already have account?

<a href="login.html">
Login
</a>

</p>

</div>

<script src="js/config.js"></script>

<script src="js/auth.js"></script>

<script>

if(localStorage.getItem("token")){

  window.location.href =
  "index.html";

}

</script>

</body>
</html>
