<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Purview • Vindarr</title>

  <link
    rel="stylesheet"
    href="css/global.css"
  >

  <link
    rel="stylesheet"
    href="css/purview.css"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

</head>

<body>

  <main class="purview-page">


<!-- =====================================
     HEADER
====================================== -->

<header class="purview-header">

  <div class="purview-header-brand">

    <img
      src="interfacelog.png"
      alt="Vindarr"
      class="purview-logo"
    >

    <div>

      <span class="purview-eyebrow">
        VINDARR
      </span>

      <h1>
        Purview
      </h1>

    </div>

  </div>

  <div class="purview-header-icon">
    <i class="bi bi-eye"></i>
  </div>

</header>


<!-- =====================================
     INTRO
====================================== -->

<section class="purview-intro">

  <p>
    Keep up with the creators and content
    you have chosen to watch.
  </p>

</section>


<!-- =====================================
     CREATORS
====================================== -->

<section class="purview-section">

  <div class="purview-section-heading">

    <div>

      <span class="section-kicker">
        YOUR PURVIEW
      </span>

      <h2>
        Creators
      </h2>

    </div>

  </div>


  <div
    id="purviewCreators"
    class="purview-creators"
  ></div>

</section>


<!-- =====================================
     RECENT POSTS
====================================== -->

<section class="purview-section purview-posts-section">

  <div class="purview-section-heading">

    <div>

      <span class="section-kicker">
        FROM YOUR CREATORS
      </span>

      <h2>
        Recent Posts
      </h2>

    </div>

  </div>


  <div
    id="purviewFeed"
    class="purview-feed"
  ></div>

</section>


  </main>

  <script src="js/config.js"></script>

  <script src="js/auth.js"></script>

  <script src="js/purview.js"></script>

  <script>
    checkAuth();
  </script>

</body>

</html>
