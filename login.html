<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet"
href="css/global.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>
<body>

<div class="auth-page">

<img
src="interfacelog.png"
width="70"
style="margin-bottom:20px;"
>

<h1>Welcome to Vindarr</h1>

<p>The African Video Mall where Africans trading with Africans is made easier.
  With your ingenuity we are 
  putting African trade back in African hands.
</p>

<br>

<input
id="loginEmail"
placeholder="Email"
class="auth-input"
>

<div class="password-wrapper">

<input
id="loginPassword"
type="password"
placeholder="Password"
class="auth-input"
>

<i
class="bi bi-eye-slash"
id="loginTogglePassword"
onclick="togglePassword('loginPassword','loginTogglePassword')"
></i>

</div>

<button
class="auth-btn"
onclick="login()"
>

Login

</button>

<p>

No account?

<a href="register.html">
Create one
</a>

</p>

</div>

<script src="js/config.js"></script>

<script src="js/auth.js"></script>

<script>

if(localStorage.getItem("token")){

  window.location.href =
  "index.html";

}

</script>

</body>
</html>
